version: 2

models:
  - name: stg_github_events
    description: "Typed, deduplicated GitHub events. One row per event_id."
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              values:
                - PushEvent
                - PullRequestEvent
                - IssuesEvent
                - IssueCommentEvent
                - WatchEvent
                - ForkEvent
                - CreateEvent
                - DeleteEvent
                - ReleaseEvent
                - PublicEvent
                - MemberEvent
                - CommitCommentEvent
                - PullRequestReviewEvent
                - PullRequestReviewCommentEvent
                - GollumEvent
              config:
                severity: warn
      - name: repo_name
        tests: [not_null]
      - name: event_created_at
        tests: [not_null]
