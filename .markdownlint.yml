# ==============================================================================================================================
# markdownlint configuration
# ==============================================================================================================================
---
ignore:
  - "CHANGELOG.md"
  - "**/CHANGELOG.md"
  # Sprint prompts are historical records for merged PRs (see AGENTS.md).
  # Retroactive rule changes would silently flag every historical prompt
  # on the next PR as an out-of-scope failure.
  - "prompt-*.md"

# Repo default line length of 128
MD013:
  line_length: 128

# Indentation level of unordered list
MD007:
  indent: 4

# Allow duplicated heading under different parents
MD024:
  siblings_only: true

# Link text should be descriptive
# Disallows link text like *here* which is annoying
MD059: false
