# ==============================================================================================================================
# markdownlint configuration
# ==============================================================================================================================
---
ignore:
  - "CHANGELOG.md"
  - "**/CHANGELOG.md"

# Repo default line length of 128. Tables get a pass because prettier
# pads cells to align columns and short tables can't be broken across
# lines without losing readability.
MD013:
  line_length: 128
  tables: false

# Indentation level of unordered list
MD007:
  indent: 4

# Allow duplicated heading under different parents
MD024:
  siblings_only: true

# Link text should be descriptive
# Disallows link text like *here* which is annoying
MD059: false
