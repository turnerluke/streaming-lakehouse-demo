# ==============================================================================================================================
# Test
# ==============================================================================================================================
# Repository-standards tests (tests/ at the repo root) plus an auto-discovered
# per-subproject matrix. Subprojects are directories that contain a
# `pyproject.toml` and a `tests/` directory. When the repo grows workspace
# members they'll be picked up automatically.
# ==============================================================================================================================
---
name: Test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ============================================================================================================================
  # Repository Standards
  # ============================================================================================================================
  repo_standards:
    name: Repository Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run repo-standards tests
        run: uv run pytest tests/ --cov --cov-report=term-missing

  # ============================================================================================================================
  # Discover Subprojects
  # ============================================================================================================================
  discover_subprojects:
    name: Discover Subprojects
    runs-on: ubuntu-latest
    outputs:
      subprojects: ${{ steps.discover.outputs.subprojects }}
      any_found: ${{ steps.discover.outputs.any_found }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Discover subprojects with tests/
        id: discover
        run: |
          subprojects=$(find . -maxdepth 4 -name "pyproject.toml" -type f \
            | while read -r file; do
              dir=$(dirname "$file")
              dir=${dir#./}
              if [ "$dir" != "." ] && [ -d "$dir/tests" ]; then
                echo "$dir"
              fi
            done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "subprojects=$subprojects" >> "$GITHUB_OUTPUT"
          if [ "$subprojects" = "[]" ]; then
            echo "any_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_found=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Discovered: $subprojects"

  # ============================================================================================================================
  # Test Subprojects (matrix)
  # ============================================================================================================================
  test_subprojects:
    name: Test ${{ matrix.subproject }}
    needs: discover_subprojects
    if: needs.discover_subprojects.outputs.any_found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subproject: ${{ fromJson(needs.discover_subprojects.outputs.subprojects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run subproject tests
        working-directory: ${{ matrix.subproject }}
        run: uv run pytest tests/ --cov --cov-report=term-missing
